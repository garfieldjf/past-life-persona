<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>页面不存在</title>
<style>
  body{margin:0;background:#F7F6F3;color:#1F1E1C;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:24px;}
  .b{max-width:380px;}
  h1{font-size:20px;font-weight:600;margin:0 0 12px;}
  p{font-size:14px;color:#5F5E5A;line-height:1.8;margin:0 0 26px;}
  a{display:inline-block;padding:12px 26px;background:#8C3A2E;color:#fff;border-radius:10px;text-decoration:none;font-size:15px;}
</style>
</head>
<body>
<div class="b">
  <h1>这个地址没有内容</h1>
  <p>可能是链接被截断了。回到首页重新开始，或者直接测一次。</p>
  <a href="./">回到首页</a>
</div>
<script>
  /* 把可能被平台截断的 hash 拼回去再跳一次 */
  (function () {
    var h = location.hash;
    if (h && h.length > 1) { location.replace('./' + h); }
  })();
</script>
</body>
</html>
